# Member 4 — Devansh Sharma — Vision Transformer
model:
  name: vit
  patch_size: 4           # 32x32 image -> 8x8 = 64 patch tokens
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_ratio: 2.0
  dropout: 0.1
  attn_dropout: 0.0

optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.05
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 5        # transformers are unstable without LR warm-up
